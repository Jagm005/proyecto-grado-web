# ============================================================
# inventario.conf  —  Nginx para la app web de inventario
#
# Instalar en: /etc/nginx/conf.d/inventario.conf
# Luego:  sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;          # Acepta cualquier host; reemplaza con tu dominio si tienes uno

    root /var/www/inventario;
    index index.html;

    # ── App React (SPA) ────────────────────────────────────────────────────────
    # Todas las rutas que NO sean /api se sirven con el index.html
    # para que React Router maneje la navegación del lado del cliente.
    # IMPORTANTE: NO incluir $uri/ en try_files — si existe una carpeta física
    # con el mismo nombre que una ruta (p.ej. /assets), nginx devolvería 403.
    location / {
        try_files $uri /index.html;
    }

    # ── Assets estáticos: cache largo ─────────────────────────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy API → Backend Node.js en localhost:3000 ──────────────────────────
    # Gracias a esto, VITE_BACKEND_URL puede quedar vacío y el puerto 3000
    # puede cerrarse al tráfico externo en el Security Group de AWS.
    location /api/ {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Seguridad: ocultar cabeceras internas del backend
        proxy_hide_header X-Powered-By;

        # Evitar que el navegador cachee respuestas de la API
        add_header Cache-Control "no-store" always;
        add_header Pragma        "no-cache" always;
    }

    # ── Seguridad básica ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "same-origin"  always;

    # Ocultar versión de Nginx
    server_tokens off;

    # Límite de tamaño de petición (subida de fotos)
    client_max_body_size 10M;

    # ── Logs ───────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/inventario_access.log;
    error_log  /var/log/nginx/inventario_error.log warn;
}
