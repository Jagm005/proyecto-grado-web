# ============================================================
# inventario.conf  —  Nginx para la app web de inventario
#
# Instalar en: /etc/nginx/conf.d/inventario.conf
# Luego:  sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: Certbot gestiona los bloques ssl_certificate automáticamente.
# Para emitir el certificado (una sola vez en el EC2):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d inventario-ucp.duckdns.org
# ============================================================

# ── Redirigir HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name inventario-ucp.duckdns.org;

    # Desafío ACME de Let's Encrypt (renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name inventario-ucp.duckdns.org;

    # Certbot coloca los certificados aquí automáticamente
    ssl_certificate     /etc/letsencrypt/live/inventario-ucp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventario-ucp.duckdns.org/privkey.pem;

    # Parámetros TLS modernos
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    root /var/www/inventario;
    index index.html;

    # ── App React (SPA) ────────────────────────────────────────────────────────
    # IMPORTANTE: NO incluir $uri/ en try_files — si existe una carpeta física
    # con el mismo nombre que una ruta (p.ej. /assets), nginx devolvería 403.
    location / {
        try_files $uri /index.html;
    }

    # ── Assets estáticos: cache largo ─────────────────────────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy API → Backend Node.js en localhost:3000 ──────────────────────────
    location /api/ {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_hide_header X-Powered-By;

        add_header Cache-Control "no-store" always;
        add_header Pragma        "no-cache" always;
    }

    # ── Seguridad básica ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "same-origin"  always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 10M;

    # ── Logs ───────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/inventario_access.log;
    error_log  /var/log/nginx/inventario_error.log warn;
}
